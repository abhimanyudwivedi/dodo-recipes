# Builds the gallery + recipe pages from the READMEs and publishes them to GitHub Pages.
# Needs: repo public (free plan), Settings → Pages → Source: GitHub Actions.
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build recipe pages (code links point to GitHub)
        run: node site/build.mjs
        env:
          REPO_URL: https://github.com/${{ github.repository }}/blob/main
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/index.html site/recipes site/concept _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
